short_bio: |
  <p>
  I am a postdoctoral researcher at the University of Oslo (UiO), working on geospatial statistics and public health. 
  My research focuses on time series analysis, spatial statistics, and machine learning for epidemiological forecasting, 
  particularly in infectious disease modeling. I explore how deep learning, climate data, and human mobility can be 
  integrated to enhance disease prediction models.
  </p>

  <p>
  I obtained my Ph.D. in Statistics from King Abdullah University of Science and Technology (KAUST), where I worked 
  on geospatial statistics and infectious disease forecasting. During my doctoral studies, I investigated statistical 
  and machine learning approaches for integrating environmental and mobility-related factors into disease prediction models.
  </p>

  <p>
  During my master's at Harbin Institute of Technology (HIT), I worked on Automated Machine Learning (AutoML), 
  particularly Neural Architecture Search (NAS), to automate model design and training processes. I also explored 
  federated learning (FL) to enable decentralized model training across multi-source datasets while preserving data privacy.
  </p>

  <p>
  Beyond forecasting and automation, I am interested in machine learning interpretability (XAI), particularly 
  counterfactual explanations, and broader discussions on responsible and trustworthy AI.
  </p>

  <p>
  I am always open to collaboration opportunities!
  </p>

